# slum_pulse event lexicon v2 — Thai keyword → category
# Segmentation taxonomy (team decision 2026-10-06):
#   crime, natural_disaster, prostitution, street_retail_popup,
#   traffic_incident, begging_homeless, technical_disaster
# Matching = substring on raw text (Thai has no spaces). Bare generic words
# (ตลาด alone, ร้านค้า) are deliberately excluded to avoid place-name false hits.
# primary_type chosen by priority: first category below that matches.

priority: [natural_disaster, technical_disaster, traffic_incident, crime, street_retail_popup, begging_homeless]

